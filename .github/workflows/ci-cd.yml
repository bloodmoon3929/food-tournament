name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  # Actions 화면의 "Run workflow" 버튼으로 다시 빌드·배포 (변수를 바꾼 뒤 등)
  workflow_dispatch:

jobs:
  ci:
    name: Continuous Integration
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # Next.js 요구사항에 맞춰 20.x 이상만 사용합니다.
        node-version: [20.x] 

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'

    - name: Install dependencies
      # 의존성 충돌 방지를 위해 아래 옵션을 유지합니다.
      run: npm install --legacy-peer-deps 

    - name: Run ESLint
      run: npm run lint || echo "Lint failed but continuing"

    - name: Run TypeScript type check
      run: npx tsc --noEmit

    - name: Build application
      run: npm run build
      env:
        NEXT_PUBLIC_GOOGLE_MAPS_API_KEY: ${{ secrets.NEXT_PUBLIC_GOOGLE_MAPS_API_KEY }}
        NEXT_PUBLIC_PROXY_URL: ${{ vars.NEXT_PUBLIC_PROXY_URL }}

  deploy:
    name: Deploy to GitHub Pages
    needs: ci
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    
    permissions:
      contents: read
      pages: write
      id-token: write

    concurrency:
      group: "pages"
      cancel-in-progress: false

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 25

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20.x
        cache: 'npm'

    - name: Install dependencies
      run: npm install --legacy-peer-deps

    - name: Build for GitHub Pages
      run: npm run build
      env:
        NEXT_PUBLIC_GOOGLE_MAPS_API_KEY: ${{ secrets.NEXT_PUBLIC_GOOGLE_MAPS_API_KEY }}
        NEXT_PUBLIC_PROXY_URL: ${{ vars.NEXT_PUBLIC_PROXY_URL }}

    - name: Setup Pages
      uses: actions/configure-pages@v4
      with:
        static_site_generator: next

    - name: Upload artifact
      uses: actions/upload-pages-artifact@v3
      with:
        # Next.js 정적 배포 폴더를 지정합니다.
        path: ./out
        # Re-run 하면 이전 시도의 artifact 가 남아 있어서 이름이 겹치면 배포가 실패한다
        name: github-pages-${{ github.run_attempt }}

    # 이전 배포가 "진행 중"으로 멈춰 있으면 새 배포가 거부된다
    # ("due to in progress deployment. Please cancel <sha> first").
    # 최근 커밋들의 Pages 배포 상태를 보고 끝나지 않은 것만 취소한다.
    - name: Cancel stuck Pages deployments
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        api="https://api.github.com/repos/${{ github.repository }}/pages/deployments"
        for sha in $(git rev-list --max-count=20 HEAD~1 2>/dev/null); do
          status=$(curl -sS -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "$api/$sha" | jq -r '.status // empty')
          case "$status" in
            deployment_queued|deployment_in_progress|syncing_files|finished_file_sync|updating_pages|purging_cdn)
              echo "cancel $sha ($status)"
              curl -sS -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
                "$api/$sha/cancel" -o /dev/null -w "  -> %{http_code}\n" || true
              ;;
          esac
        done

    - name: Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v4
      with:
        artifact_name: github-pages-${{ github.run_attempt }}
